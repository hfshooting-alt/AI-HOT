name: 流水线离线回归

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: 无本地配置与密钥的离线回归
        run: python scripts/test_pipeline.py offline
