name: 部署 AI HOT 到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        run: npm ci --prefix web
      - name: 类型检查
        run: npm --prefix web run typecheck
      - name: 构建 GitHub Pages 静态站点
        run: npm --prefix web run build:pages
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/client
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
