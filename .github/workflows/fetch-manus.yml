name: AI HOT 每日采集与完整数据更新

on:
  schedule:
    - cron: "30 1 * * *" # 北京时间 09:30 开始，全部完成后发布；调度可能延迟
  workflow_dispatch:
    inputs:
      date:
        description: "窗口结束日 YYYY-MM-DD；采集前一日09:30至该日09:30，留空取最近已到达的09:30"
        type: string
        default: ""
      stage:
        description: "执行阶段；正式每日更新使用 all"
        type: choice
        options: [all, snapshot, overview, funding]
        default: all
      source_mode:
        description: "数据模式；aihot-only 不调用 Manus 或大模型"
        type: choice
        options: [full, aihot-only]
        default: full
      promote:
        description: "所选阶段全部成功后更新正式数据"
        type: boolean
        default: true
      dry_run:
        description: "仅输出计划，不调用接口、不写数据"
        type: boolean
        default: false
      skip_search:
        description: "跳过可选 Tavily 搜索补全"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # 数据提交后显式触发 Pages；GITHUB_TOKEN 的 push 不会触发其他工作流

concurrency:
  group: ai-hot-data-pipeline
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt
      - name: 离线契约与流水线回归
        run: python scripts/test_pipeline.py offline
      - name: 统一运行（检查 → 采集 → 正文 → feed → 快照/日报/周报 → 公司库 → 融资表 → 发布）
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_SEARCH: ${{ inputs.skip_search }}
        shell: bash
        run: |
          args=(run --window-mode ten-am --cutoff-time 09:30 --stage "${INPUT_STAGE:-all}" --source-mode "${INPUT_SOURCE_MODE:-full}")
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_PROMOTE" = "false" ]; then args+=(--no-promote); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_SKIP_SEARCH" = "true" ]; then args+=(--skip-search); fi
          python scripts/run_pipeline.py "${args[@]}"
      - name: 提交整套已发布数据
        if: ${{ success() && (github.event_name == 'schedule' || (inputs.promote && !inputs.dry_run)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/manus data/funding data/company-overview data/archive data/cache web/public
          if git diff --cached --quiet; then
            echo "正式数据没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新 AI HOT 全链路数据"
          git pull --rebase origin main
          git push
          gh workflow run deploy-pages.yml --ref main
      - name: 保存不含正文与密钥的阶段状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-${{ github.run_id }}
          path: work/runs/**/state.json
          retention-days: 7
          if-no-files-found: ignore
      - name: 运行摘要
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "### AI HOT 数据更新：$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "失败阶段见上方日志及 pipeline-status Artifact；失败时保留原正式数据。" >> "$GITHUB_STEP_SUMMARY"
