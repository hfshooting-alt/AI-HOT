name: 新闻Daily 新闻采集与完整数据更新

on:
  # 2026-09-22: user paused automatic collection; keep manual full workflow available.
  workflow_dispatch:
    inputs:
      date:
        description: "扫描窗口结束日 YYYY-MM-DD；留空使用扫描开始的北京时间日期"
        type: string
        default: ""
      stage:
        description: "执行阶段；正式每日更新使用 all"
        type: choice
        options: [all, snapshot, overview, funding]
        default: all
      source_mode:
        description: "manus-only 或匿名媒体直采 direct-only（直采选 all）；AIHOT已停止"
        type: choice
        options: [manus-only, direct-only]
        default: manus-only
      window_end:
        description: "含时区ISO扫描开始时刻，留空取当前北京时间到秒；固定回溯24小时"
        type: string
        default: ""
      manus_credit_limit:
        description: "每来源观察止损线，默认20；显式0取消观察线（费用非硬上限）"
        type: number
        default: 20
      promote:
        description: "所选阶段全部成功后更新正式数据"
        type: boolean
        default: true
      dry_run:
        description: "仅输出计划，不调用接口、不写数据"
        type: boolean
        default: false
      skip_search:
        description: "跳过可选 Tavily 搜索补全"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # 数据提交后显式触发 Pages；GITHUB_TOKEN 的 push 不会触发其他工作流

concurrency:
  group: ai-hot-data-pipeline
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Shanghai # 手动运行和采集窗口均使用北京时间
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 记录北京时间计划与实际触发时间
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/automation/schedule_audit.py
      - name: 安装依赖
        run: python -m pip install -r scripts/requirements.txt
      - name: 离线契约与流水线回归
        run: python scripts/test_pipeline.py offline
      - name: 公司搜索配额日期（北京时间）
        id: research-day
        run: echo "day=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: 读取当天公司 DeepSeek 补全租约
        id: company-research-restore
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || (!inputs.dry_run && (inputs.stage == 'all' || inputs.stage == 'overview')) }}
        uses: actions/cache/restore@v4
        with:
          path: work/company-research-budget/lease.json
          key: company-research-day-${{ steps.research-day.outputs.day }}
      - name: 检查运行历史并预留整日公司补全额度
        id: company-research-reserve
        continue-on-error: true
        if: ${{ steps.company-research-restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEARCH_DAY: ${{ steps.research-day.outputs.day }}
        run: PYTHONPATH=scripts python -m company_index.research_budget --reserve --day "$RESEARCH_DAY" --directory work/company-research-budget
      - name: 持久化非私有公司补全租约
        id: company-research-save
        continue-on-error: true
        if: ${{ steps.company-research-reserve.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: work/company-research-budget/lease.json
          key: company-research-day-${{ steps.research-day.outputs.day }}
      - name: 读回确认公司补全租约
        id: company-research-confirm
        continue-on-error: true
        if: ${{ steps.company-research-save.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: work/company-research-budget/lease.json
          key: company-research-day-${{ steps.research-day.outputs.day }}
          fail-on-cache-miss: true
      - name: 验证当前运行和北京时间日匹配租约
        id: company-research-ready
        continue-on-error: true
        if: ${{ steps.company-research-confirm.outcome == 'success' && steps.company-research-confirm.outputs.cache-hit == 'true' }}
        env:
          RESEARCH_DAY: ${{ steps.research-day.outputs.day }}
        run: PYTHONPATH=scripts python -m company_index.research_budget --check --day "$RESEARCH_DAY" --directory work/company-research-budget
      - name: 读取当天公司搜索占位
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: work/company-discovery/quota.json
          key: company-discovery-day-${{ steps.research-day.outputs.day }}
      - name: 预留每天一次的公司搜索
        continue-on-error: true
        if: ${{ !inputs.dry_run && (inputs.stage == 'all' || inputs.stage == 'overview') }}
        run: PYTHONPATH=scripts python -m company_index.discovery --reserve
      - name: 创建任务前持久化配额占位
        continue-on-error: true
        if: ${{ !inputs.dry_run && (inputs.stage == 'all' || inputs.stage == 'overview') }}
        uses: actions/cache/save@v4
        with:
          path: work/company-discovery/quota.json
          key: company-discovery-day-${{ steps.research-day.outputs.day }}
      - name: 确认配额已持久化后才允许付费流程
        id: company-quota-confirm
        continue-on-error: true
        if: ${{ !inputs.dry_run && (inputs.stage == 'all' || inputs.stage == 'overview') }}
        uses: actions/cache/restore@v4
        with:
          path: work/company-discovery/quota.json
          key: company-discovery-day-${{ steps.research-day.outputs.day }}
          fail-on-cache-miss: true
      - name: Manus发现 → 脚本正文 → 统一模型处理 → 发布成功来源
        env:
          MANUS_CONTENT_MODE: script
          COMPANY_RESEARCH_BUDGET_READY: ${{ steps.company-research-ready.outcome == 'success' && '1' || '0' }}
          COMPANY_DISCOVERY_QUOTA_READY: ${{ steps.company-quota-confirm.outcome == 'success' && '1' || '0' }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.PARATERA_API_KEY || secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_BASE: ${{ secrets.PARATERA_API_KEY != '' && 'https://llmapi.paratera.com/v1' || vars.LLM_API_BASE || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.PARATERA_API_KEY != '' && 'DeepSeek-V4-Pro' || vars.LLM_MODEL || 'deepseek-v4-flash' }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_WINDOW_END: ${{ inputs.window_end }}
          INPUT_MANUS_CREDIT_LIMIT: ${{ inputs.manus_credit_limit }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_SEARCH: ${{ inputs.skip_search }}
        shell: bash
        run: |
          args=(run --window-mode rolling-24h --stage "${INPUT_STAGE:-all}" --source-mode "${INPUT_SOURCE_MODE:-manus-only}" --manus-credit-limit "${INPUT_MANUS_CREDIT_LIMIT:-20}")
          if [ -n "$INPUT_WINDOW_END" ]; then args+=(--window-end "$INPUT_WINDOW_END"); fi
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_PROMOTE" = "false" ]; then args+=(--no-promote); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_SKIP_SEARCH" = "true" ]; then args+=(--skip-search); fi
          python scripts/run_pipeline.py "${args[@]}"
      - name: 提交整套已发布数据
        if: ${{ success() && (github.event_name == 'schedule' || (inputs.promote && !inputs.dry_run)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/manus data/funding data/company-overview data/archive data/cache web/public
          if git diff --cached --quiet; then
            echo "正式数据没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新 新闻Daily 全链路数据"
          git pull --rebase origin main
          git push
          PUSHED_SHA="$(git rev-parse HEAD)"
          record_receipt() {
            if ! PYTHONPATH=scripts python -m automation.publication_receipt --data-sha "$PUSHED_SHA" --pages-dispatch "$1"; then
              echo "::warning::发布回执写入失败；Pages 触发状态需日志补证。"
            fi
          }
          record_receipt pending
          if gh workflow run deploy-pages.yml --ref main; then
            record_receipt accepted
          else
            record_receipt failed
            exit 1
          fi
      - name: 汇总不含正文的费用与停止诊断
        if: always()
        run: python scripts/automation/diagnostic_summary.py
      - name: 加密保存采集证据与模型缓存
        if: ${{ always() && !inputs.dry_run }}
        env:
          PIPELINE_RECOVERY_KEY: ${{ secrets.PIPELINE_RECOVERY_KEY || secrets.PARATERA_API_KEY || secrets.DEEPSEEK_API_KEY || secrets.MANUS_API_KEY }}
        run: PYTHONPATH=scripts python -m automation.recovery pack --path work/checkpoint/recovery.bin
      - name: 上传加密恢复包
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-recovery-${{ github.run_id }}
          path: work/checkpoint/recovery.bin
          retention-days: 7
          if-no-files-found: warn
      - name: 保存不含正文与密钥的阶段状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-${{ github.run_id }}
          path: |
            work/runs/**/state.json
            work/diagnostic-summary.json
            work/schedule-audit.json
            work/publication-receipt.json
          retention-days: 7
          if-no-files-found: ignore
      - name: 运行摘要
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "### 新闻Daily 数据更新：$RESULT" >> "$GITHUB_STEP_SUMMARY"
          PYTHONPATH=scripts python -m automation.run_summary
