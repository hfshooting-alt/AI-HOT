<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司资料补全记录 · AI HOT</title>
<style>body{background:#f7f8f5;color:#213e35;font:15px/1.7 system-ui;margin:0}main{max-width:1100px;margin:40px auto;padding:24px}a{color:#236b53;display:inline-block;margin-right:12px}h1{font-size:28px}h2{font-size:21px;margin-top:32px}p{color:#65746b}.wrap{overflow:auto;border:1px solid #d6e0d8;border-radius:12px;background:white}table{border-collapse:collapse;width:100%;min-width:700px}td,th{padding:14px;text-align:left;border-bottom:1px solid #e5ebe7}th{background:#edf4ee}.metrics{display:flex;flex-wrap:wrap;gap:12px}.metric{padding:16px 20px;background:white;border:1px solid #d6e0d8;border-radius:12px;flex:1;min-width:130px}.metric b{font-size:25px;display:block}</style>
<main><a href="./#/company">← 公司与产品全景</a><a href="./company-research-review.html">逐字段来源核验 ↗</a><h1>公司资料补全记录</h1>
<p>新闻抽取与背景资料检索分别记录。空白可能来自尚未检索、网页无法读取或证据不足；没有新增字段不等于网上没有资料。</p><section id="coverage" class="metrics" aria-label="当前资料空缺"></section>
<section id="review" hidden><h2>最近一次定向联网补全</h2><p id="review-summary"></p><div class="wrap"><table><thead><tr><th>主体</th><th>本次补入</th><th>仍待补证 / 审阅说明</th><th>资料链接</th></tr></thead><tbody id="review-rows"></tbody></table></div></section>
<h2>最近已发布批次的自动补全</h2><p>单轮最多检查 5 个主体、10 个网页，调用 5 次 DeepSeek；已发布状态中的同日用量会抵扣。Manus 每天最多为 1 个缺资料主体寻找网页，20 credits 观察止损；两条费用单独记录。</p><p id="discovery"></p><p id="summary">正在读取…</p><p id="queue"></p><div class="wrap"><table><thead><tr><th>主体</th><th>处理结果</th><th>补充字段</th><th>隔离建议数</th><th>资料链接</th></tr></thead><tbody id="rows"></tbody></table></div><p id="note"></p></main>
<script>
const $=id=>document.getElementById(id);
const labels={country:'国家/地区',founded:'法人注册日期',business:'主营业务',team:'团队',investors:'投资方',total_funding:'累计融资',valuation:'估值',candidateOwners:'候选归属'};
const statuses={completed:'已检查',completed_no_supported_fields:'模型已完成，无合格增量',no_readable_page:'网页未能读取',model_or_evidence_failed:'模型或证据未通过'};
const time=value=>{const d=new Date(value);return Number.isNaN(d.valueOf())?'时间未记录':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)+' 北京时间'};
function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.append(td);return td}
function links(tr,urls){const td=cell(tr,'');for(const [i,url]of (urls||[]).entries()){try{if(new URL(url).protocol!=='https:')continue}catch{continue}const a=document.createElement('a');a.href=url;a.textContent='来源 '+(i+1);a.target='_blank';a.rel='noopener noreferrer';td.append(a)}}
fetch('./company-overview.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{
  const companies=d.companies||[];
  for(const [name,value]of [['库内主体',companies.length],...['business','country','founded','team'].map(f=>[labels[f]+'空缺',companies.filter(c=>!c[f]).length])]){const item=document.createElement('div');item.className='metric';const b=document.createElement('b');b.textContent=value;item.append(b,document.createTextNode(name));$('coverage').append(item)}
  const search=d.companyDiscovery?.last;if(search)$('discovery').textContent='最近公司链接搜索：'+search.name+' · '+search.status+' · 已记录 '+(search.creditsUsed??'未返回')+' credits · 找到 '+(search.urls?.length||0)+' 个链接。'+(search.validation||'');
  const x=d.knownLinkResearch;if(!x){$('summary').textContent='尚无自动补全记录';return}
  $('summary').textContent=time(x.checkedAt)+' · 模型尝试 '+x.attempted+' 个主体 · 补充 '+x.filled+' 项 · 失败 '+x.failed+' 项 · 输入未变化跳过 '+x.skippedUnchanged+' 项 · 本轮暂缓 '+x.deferred+' 项';
  if(x.queue)$('queue').textContent='待处理范围：基本资料 '+x.queue.basicProfile+' 个、待归属 '+x.queue.pendingOwnership+' 个、仅缺财务字段 '+x.queue.financialOnly+' 个。'+(x.dailyLimitReached?'按已保存记录，当日配额已用完，余项保留后续处理。':'')+(x.circuitOpen?'模型服务异常，已停止后续请求并保留已完成结果。':'');
  for(const row of x.records||[]){const tr=document.createElement('tr');for(const value of [row.name,statuses[row.status]||row.status,(row.filledFields||[]).map(f=>labels[f]||f).join('、')||'无新增',row.rejectedFacts||0])cell(tr,value);links(tr,row.urls);$('rows').append(tr)}
  $('note').textContent=x.validation||'基本资料和待归属主体优先；自动建议只补空白并标暂定。历史记录缺少逐字段结果时，不能据此判定已全面检索。';
}).catch(()=>$('summary').textContent='记录读取失败，请刷新重试');
fetch('./company-profile-review.json').then(r=>r.ok?r.json():null).then(r=>{
  if(!r)return;$('review').hidden=false;
  $('review-summary').textContent=time(r.checkedAt)+' · '+r.records.length+' 个主体 · 补入 '+r.filled+' 项 · DeepSeek '+r.modelRequests+' 次 / '+r.totalTokens.toLocaleString()+' tokens。'+r.validation;
  for(const row of r.records){const tr=document.createElement('tr');cell(tr,row.name);cell(tr,row.filledFields.map(f=>labels[f]||f).join('、'));cell(tr,row.note);links(tr,row.urls);$('review-rows').append(tr)}
}).catch(()=>{});
</script></html>
