<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司资料核验 · AI HOT</title>
<style>body{margin:0;background:#f7f8f5;color:#223b31;font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1380px;margin:48px auto;padding:0 24px}a{color:#246b51;text-underline-offset:3px}header{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:1px solid #cbd5cc;padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#5b7867}h1{font-size:32px;margin:5px 0 8px;font-weight:600}p{color:#617467;max-width:850px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.metric{padding:20px;background:#fff;border:1px solid #dbe2d9;border-radius:12px}.metric strong{font-size:28px;display:block}.metric span{color:#617467;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}input,select{font:inherit;padding:10px 14px;border:1px solid #cbd5cc;border-radius:8px;background:white;color:inherit}input{min-width:280px;flex:1}.tablewrap{overflow:auto;border:1px solid #dbe2d9;border-radius:12px;background:white}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e5eae3;padding:13px 12px}th{font-weight:500;background:#eef2eb;white-space:nowrap}th:first-child,td:first-child{min-width:150px}td{font-size:13px;min-width:110px}details{margin-top:6px}summary{cursor:pointer;color:#53725d}.status{display:inline-block;border-radius:4px;padding:1px 5px;background:#f1f2ec;font-size:11px;margin-top:5px;color:#687460}.verified{background:#e3f0e4;color:#2e6a43}.value{max-width:210px;overflow-wrap:anywhere}.note{font-size:12px;color:#6d796e;max-width:260px}footer{padding:24px 0;color:#778677;font-size:12px}@media(max-width:700px){main{margin:24px auto;padding:0 14px}.metrics{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}header{display:block}}</style></head>
<body><main><header><div><div class="eyebrow">AI HOT / RESEARCH REVIEW</div><h1>公司资料核验</h1><p>覆盖当前新闻关联主体及待归属产品。逐字段区分外部证据与原报道值；资料核验时间独立于新闻发布时间。</p><div id="date"></div></div><a href="./#/company">返回公司与产品全景 ↗</a></header><section class="metrics" id="metrics"></section><div class="controls"><input id="q" aria-label="搜索主体" placeholder="搜索公司、产品或核验说明"><select id="filter" aria-label="筛选核验状态"><option value="all">全部主体</option><option value="pending">归属待核实</option><option value="missing">仍有字段待补证</option></select></div><p id="count" aria-live="polite"></p><div class="tablewrap"><table><thead><tr><th>新闻关联主体</th><th>国家 / 地区</th><th>法人注册日期</th><th>主营业务</th><th>团队</th><th>投资方</th><th>累计融资</th><th>融资估值</th></tr></thead><tbody id="rows"></tbody></table></div><footer>未获合格证据表示本轮检索未能证实，不等于该信息不存在。单轮融资不填入累计融资；总部国家与控股法人登记地分别注明。未添加新闻未提及的产品。</footer></main>
<script>
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const link=(url,text)=>{const a=el('a',text);if(url.startsWith('https://')){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}return a};
fetch('./company-research-review.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
 document.querySelector('#date').textContent='核验时间：'+d.checkedAt.slice(0,19).replace('T',' ')+' 北京时间';
 for(const [v,t]of [[d.reviewedRecords,'已逐项检查的记录'],[d.acceptedFacts,'经复核的字段 / 归属证据'],[d.missingCountryBefore+' → '+d.missingCountryAfter,'国家缺失记录'],[d.newsUnchanged,'新闻保持原批次']]){const n=el('div',null,'metric');n.append(el('strong',v),el('span',t));document.querySelector('#metrics').append(n)}
 const render=()=>{const q=document.querySelector('#q').value.toLowerCase();const filter=document.querySelector('#filter').value;const rs=d.records.filter(r=>(r.name+' '+r.currentName+' '+r.note).toLowerCase().includes(q)&&(filter==='all'||filter==='pending'&&r.pending||filter==='missing'&&Object.values(r.fields).some(f=>f.status!=='已核验')));document.querySelector('#count').textContent='显示 '+rs.length+' / '+d.records.length+' 条；DeepSeek '+d.modelRequests+' 次，Manus '+d.manusRequests+' 次。';const body=document.querySelector('#rows');body.replaceChildren();for(const r of rs){const tr=el('tr');const first=el('td');first.append(el('strong',r.name));if(r.currentName!==r.name)first.append(el('div','归入 '+r.currentName,'note'));first.append(el('div',r.note,'note'));const sources=el('details');sources.append(el('summary','检索入口 '+r.checkedUrls.length));for(const u of r.checkedUrls){const row=el('div');row.append(link(u,new URL(u).hostname));sources.append(row)}first.append(sources);tr.append(first);for(const f of Object.values(r.fields)){const td=el('td');td.append(el('div',f.value||'待补证','value'),el('span',f.status,'status '+(f.status==='已核验'?'verified':'')));if(f.reason){const x=el('details');x.append(el('summary','说明'),el('div',f.reason,'note'));td.append(x)}f.sources.forEach((u,i)=>{const x=el('div');x.append(link(u,'证据 '+(i+1)+' ↗'));td.append(x)});tr.append(td)}body.append(tr)}};
 document.querySelector('#q').addEventListener('input',render);document.querySelector('#filter').addEventListener('change',render);render();
}).catch(e=>document.querySelector('#count').textContent='报告加载失败：'+e.message);
</script></body></html>
