<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1440px;margin:0 auto;padding:0 20px}
  /* P2：双栏布局（日期列表 + 正文） */
  .layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
  .rail{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow-y:auto;padding-right:4px}
  .rail-h{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.1em;margin:14px 0 8px}
  .rail-h:first-child{margin-top:0}
  .dlink{display:block;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:7px;text-decoration:none;transition:.15s}
  .dlink:hover{border-color:var(--accent);transform:translateX(2px)}
  .dlink.cur{border-color:var(--accent);background:#1e2436}
  .d-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--txt)}
  .d-title{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:auto}
  .badge.lock{color:#a5b4fc;background:rgba(165,180,252,.12);border:1px solid rgba(165,180,252,.35)}
  .badge.live{color:#6ee7b7;background:rgba(110,231,183,.1);border:1px solid rgba(6,95,70,.6)}
  .back{display:inline-block;font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 12px;margin-bottom:12px;transition:.18s}
  .back:hover{background:var(--accent);color:#0b0e14}
  /* VOL 期刊头 */
  .hero{padding:30px 0 20px;border-bottom:1px solid var(--line)}
  .vol{color:var(--mut);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase}
  .hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;margin:8px 0 4px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{color:var(--mut);font-size:13.5px;margin-top:4px}.meta b{color:var(--txt)}
  .state{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:1px}
  .state.lock{color:#a5b4fc;background:rgba(165,180,252,.12);border:1px solid rgba(165,180,252,.4)}
  .state.live{color:#6ee7b7;background:rgba(110,231,183,.1);border:1px solid rgba(6,95,70,.6)}
  .lead{margin-top:12px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  /* tab + 筛选行 */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 20px}
  .tab{font-weight:700;font-size:13.5px;padding:7px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.18s}
  .tab.active{color:#0b0e14;background:linear-gradient(90deg,#a5b4fc,#67e8f9);border-color:transparent}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .fchip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;transition:.18s}
  .fchip.on{color:var(--txt);border-color:var(--accent);background:#1e2436}
  .fchip.wx.on{color:#062; border-color:var(--wx);background:#0c2a18}
  #q{background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:5px 11px;font-size:12px;outline:none}
  /* 今日看点 */
  .peek{margin:0 0 26px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .peek-h{padding:11px 15px;font-size:14px;font-weight:800;border-bottom:1px solid var(--line);background:var(--card2)}
  .peek-row{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px dashed var(--line);cursor:pointer;transition:.15s}
  .peek-row:last-child{border-bottom:none}
  .peek-row:hover{background:var(--card2)}
  .peek-num{font-size:13px;font-weight:800;color:var(--c);min-width:24px}
  .peek-label{font-size:13.5px;font-weight:700;white-space:nowrap}
  .peek-c{font-size:12px;color:var(--mut);white-space:nowrap}
  .peek-title{font-size:12px;color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .week-note{margin:0 0 24px;font-size:13px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
  .week-note a{color:#a5b4fc}
  .block{margin-bottom:34px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .block.flash{animation:secflash 1.6s ease}
  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}
  .source{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  .cat-badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;color:var(--cc);border:1px solid var(--cc);background:var(--card2)}
  .dim-pill{font-size:10.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .score-badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .score-badge.hi{color:#fcd34d;background:rgba(252,211,77,.13);border:1px solid rgba(252,211,77,.4)}
  .score-badge.mid{color:#a5b4fc;background:rgba(165,180,252,.12);border:1px solid rgba(165,180,252,.35)}
  .score-badge.lo{color:var(--mut);background:var(--card2);border:1px solid var(--line)}
  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
  @media(max-width:960px){.layout{grid-template-columns:1fr}.rail{position:static;max-height:none}}
</style>

03"},{"id":"direct:f5c5f94f1ca4a43e","title":"受糯米糖纸启发！MIT造了块能吞下肚、还能自己“化掉”的纸电池","summary":"麻省理工学院团队受糯米纸糖果启发，开发出一种可在消化道内降解的纸电池，相关研究于9月21日发表在《自然-化学工程》。该电池负极使用AZ31镁合金，正极将三氧化钼、纤维素纳米纤维和活性炭混合成薄片，电解质采用氯化胆碱与乳酸制成的可生物降解离子液体凝胶，外层用蜂蜡封装。模拟胃液实验中电池可在3天内保持结构完整。在实验猪体内，电池72小时后仍能正常输出，并成功驱动可吸收射频识别胶囊和胃电刺激设备，未出现黏膜损伤。","url":"https://view.inews.qq.com/a/20260927A0BPWR00","source":"腾讯新闻转载：DeepTech深科技","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-09-27T19:57:56+08:00","publishedPrecision":"datetime","timeEvidence":{"originalText":"2026-09-27 19:57:56","observedAt":"2026-09-28T15:18:39+08:00","kind":"absolute","field":"detail.meta.article:published_time + article header","normalizedAt":"2026-09-27T19:57:56+08:00"},"discoveredAt":"","timeBasis":"published","score":null,"selected":null,"aihotUrl":"","originalUrl":"https://view.inews.qq.com/a/20260927A0BPWR00","reason":null,"mpName":"DeepTech深科技","sourceRefs":[{"collector":"direct_site","source":"DeepTech深科技","url":"https://view.inews.qq.com/a/20260927A0BPWR00","publishedAt":"2026-09-27T19:57:56+08:00"}],"evidenceKind":"article_body","summaryOrigin":"model","contentStatus":"available","classificationStatus":"complete","summaryStatus":"complete","classification":{"cat":"paper","catLabel":"论文研究","dims":[],"autoFallback":false},"num":7,"timeText":"9/27 19:57"},{"id":"direct:d3efd033fdd030b7","title":"“网红芯片分析师”P Equity访谈：算力缺口、存储周期、隐形瓶颈、铜退光进以及“10年需求能见度的弥天大谎”","summary":"9月26日，匿名分析师Mr. P在Logan Jastremski播客中表示，超大型云厂商宣称的十年AI需求能见度是“弥天大谎”，他们无法预测两年后的情况。他预计明年云厂商资本支出为1.1万亿至1.2万亿美元，其中存储可能占50%到60%，瑞银估计明年存储支出将达9000亿美元。Mr. P认为存储仍具周期性，长期协议可能被私下取消。","url":"https://view.inews.qq.com/a/20260927A0BFKH00","source":"腾讯新闻转载：华尔街见闻","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-09-27T19:27:15+08:00", llback":false},"num":45,"timeText":"9/26 13:08"},{"id":"direct:59b63e631a5ed5d7","title":"对话OpenAI Codex负责人Tibo：Codex的终极目标不只是Coding Agent","summary":"OpenAI Codex负责人Tibo Sottiaux在接受The Pragmatic Engineer访谈时，回顾了Codex的诞生历程与技术选择。他介绍，Codex前身是OpenAI内部帮助研究人员编写Python的小型智能体，后与自主软件工程师项目ASWE合并，最终发展为今天的Codex。","url":"https://view.inews.qq.com/a/20260926A0587T00","source":"腾讯新闻转载：ZPotential","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-09-26T12:08:37+08:00","publishedPrecision":"datetime","timeEvidence":{"originalText":"2026-09-26 12:08:37","observedAt":"2026-09-27T14:52:12+08:00","kind":"absolute","field":"detail.meta.article:published_time + article header","normalizedAt":"2026-09-26T12:08:37+08:00"},"discoveredAt":"","timeBasis":"published","score":null,"selected":null,"aihotUrl":"","originalUrl":"https://view.inews.qq.com/a/20260926A0587T00","reason":null,"mpName":"ZPotential","sourceRefs":[{"collector":"direct_site","source":"ZPotential","url":"https://view.inews.qq.com/a/20260926A0587T00","publishedAt":"2026-09-26T12:08:37+08:00"}],"evidenceKind":"article_body","summaryOrigin":"model","contentStatus":"available","classificationStatus":"complete","summaryStatus":"complete","classification":{"cat":"interview","catLabel":"深度访谈","dims":[{"label":"行业","value":"AI模型"},{"label":"访谈对象","value":"创始人/CEO"}],"autoFallback":false},"num":46,"timeText":"9/26 12:08"},{"id":"direct:1cc5a724b095d485","title":"高盛测算：“AI第二阶段”的“资本缺口”要怎么补？","summary":"高盛最新研究测算，六大超大规模云计算企业若要在2026至2027年约1.73万亿美元的AI算力资本支出上实现15%的投入资本回报率，需在2028至2030年间累计创造约1.42万亿美元收入。高盛将本轮AI算力建设周期划分为三个阶段，其中第二阶段总资本支出约1.73万亿美元，第三阶段高达约4.14万亿美元。报告指出，仅第二阶段资产每年的折旧摊销便高达2760亿美元，约为所需EBIT的1.7倍，GPU实际使用寿命成为关键变量。","url":"https://view.inews.qq.com/a/20260926A051FV00","source":"腾讯新闻转载：华尔街见闻","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","cat 发百度最高奖，各奖励100万美元。天池团队研发面向万亿级MoE大模型的百度天池超节点架构，dodo团队打造企业AI员工。文章回顾了百度自研AI芯片昆仑芯的历程：2010年前后因算力成本压力启动自研探索，2018年发布第一代昆仑芯片，2021年发布昆仑2并将芯片业务独立为昆仑芯公司，首轮融资后估值130亿元。","url":"https://view.inews.qq.com/a/20260924A0E09600","source":"腾讯新闻转载：极客公园","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-09-24T19:34:13+08:00","publishedPrecision":"datetime","timeEvidence":{"originalText":"2026-09-24 19:34:13","observedAt":"2026-09-25T14:23:08+08:00","kind":"absolute","field":"detail.meta.article:published_time + article header","normalizedAt":"2026-09-24T19:34:13+08:00"},"discoveredAt":"","timeBasis":"published","score":null,"selected":null,"aihotUrl":"","originalUrl":"https://view.inews.qq.com/a/20260924A0E09600","reason":null,"mpName":"极客公园","sourceRefs":[{"collector":"direct_site","source":"极客公园","url":"https://view.inews.qq.com/a/20260924A0E09600","publishedAt":"2026-09-24T19:34:13+08:00"}],"evidenceKind":"article_body","summaryOrigin":"model","contentStatus":"available","classificationStatus":"complete","summaryStatus":"complete","classification":{"cat":"bigtech","catLabel":"大厂动态","dims":[{"label":"类型","value":"业务线变化"},{"label":"公司","value":"其他"}],"autoFallback":false},"num":121,"timeText":"9/24 19:34"},{"id":"direct:80a3fea554775cf5","title":"ChatGPT之后，下一个全民AI应用会是Meta Muse吗？","summary":"Meta于9月8日推出AI个人代理产品Muse，上线首六天下载量达90.2万次，登顶美国及加拿大苹果应用商店免费榜榜首，并带动Meta股价两周内上涨21%。Muse定位为代劳型AI代理，可执行网购、旅行预订、邮件处理等任务，设有免费及每月20美元、100美元三档定价。其技术架构基于开源代理框架OpenClaw，Meta将自托管流程压缩为一分钟注册体验。","url":"https://view.inews.qq.com/a/20260924A0AN5T00","source":"腾讯新闻转载：华尔街见闻","sourceType":"media","collector":"direct_site","sourceChannel":"tencent_syndication","sourcePlatform":"Tencent News","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-09-24T19:25:56+08:00","publishedPrecision":"datetime","timeEvidence":{"originalText":"2026-09-24 19:25:56","observedAt":"2026-09-25T14:2 const SECTION_COLORS = {"模型发布/更新":"#6366f1","产品发布/更新":"#10b981","AI泛娱乐新闻":"#ec4899","行业动态":"#f59e0b","论文研究":"#f43f5e","技巧与观点":"#06b6d4"};
const CATEGORY_COLORS = {"financing":"#f59e0b","release":"#6366f1","bigtech":"#0ea5e9","paper":"#f43f5e","interview":"#a855f7","general":"#64748b"};
let state = { tab:"daily", src:null, cat:null, q:"" };

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cardHTML(i, n){
  const wx = i.sourceType==="wechat";
  return '<article class="card ' + (wx?'wx':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    '<div class="ct"><span class="num">' + String(n).padStart(2,'0') + '</span>' +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      (i.classification ? '<span class="cat-badge" style="--cc:' + (CATEGORY_COLORS[i.classification.cat]||'#64748b') + '">' + esc(i.classification.catLabel) + '</span>' +
        (i.classification.dims||[]).slice(0,2).map(d=>'<span class="dim-pill">' + esc(d.value) + '</span>').join('') : '') +
      '<span class="time">' + esc(i.timeText||'') + '</span></div>' +
    '<h3 class="title"><a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a></h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    '<div class="card-foot"><a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a></div>' +
    '</article>';
}

function peekHTML(view, headText){
  const rows = view.sections.filter(s=>s.count>0);
  if(!rows.length) return "";
  return `<div class="peek"><div class="peek-h">${esc(headText)}</div>` + rows.map((s,ix)=>{
    const lead = s.items.reduce((a,b)=>((b.score||0)>(a.score||0)?b:a), s.items[0]);
    return `<div class="peek-row" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}">
      <span class="peek-num">${String(ix+1).padStart(2,'0')}</span>
      <span class="peek-label">${esc(s.label)}</span>
      <span class="peek-c">${s.count} 条</span>
      <span class="peek-title">${esc((lead&&lead.title)||'')}</span></div>`;
  }).join("") + `</div>`;
}

function curView(){
  if(state.tab==="weekly" && DATA.weekData && DATA.weekData.available) return DATA.weekData;
  return DATA;
}

function render(){
  /* 头部：日报 tab 显示当日 VOL；周报 tab 显示所属周 VOL */
  const wk = DATA.weekData;
  const onWeek = state.tab==="weekly";
  document.getElementById("vol").textContent = onWeek && wk.available
    ? `${wk.vol} · ${wk.total} STORIES · 新闻Daily 周报`
    : `${DATA.vol} · ${DATA.total} STORIES · 新闻Daily 日归档`;
  document.getElementById("cnTitle").textContent = onWeek && wk.available
    ? `${wk.label} · ${wk.rangeLabel}` : DATA.cnLabel;
  const fin = DATA.finalized;
  const finText = fin
    ? '已定稿' + (DATA.finalizedAt ? ' · 定稿于 ' + String(DATA.finalizedAt).slice(5,10) + ' ' + String(DATA.finalizedAt).slice(11,16) : '')
    : '更新中（当日归档仍在累积）';
  document.getElementById("meta").innerHTML = onWeek && wk.available
    ? `共 <b>${wk.total}</b> 条 · 六版块 · 周期刊已定稿 · <a href="${esc('../'+wk.url)}" style="color:#a5b4fc">期刊页 ↗</a>`
    : `${esc(DATA.dateLabel)} · 共 <b>${DATA.total}</b> 条 · 六版块<span class="state ${fin?'lock':'live'}">${finText}</span>`;
  const v = curView();
  const lead = document.getElementById("lead");
  if(!onWeek && DATA.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">当日头条</span>${esc(DATA.lead)}`; }
  else if(onWeek && wk.available && wk.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">本周头条</span>${esc(wk.lead)}`; }
  else lead.style.display="none";

  const body = document.getElementById("body");
  if(onWeek && !wk.available){
    body.innerHTML = `<div class="week-note">${esc(wk.note||'该日无所属自然周（月初残日）')}</div>`;
    return;
  }
  const q = state.q.toLowerCase();
  let html = peekHTML(v, onWeek ? "本周看点" : "今日看点");
  let total = 0;
  v.sections.forEach(sec=>{
    let items = sec.items;
    if(state.src==="wechat") items = items.filter(i=>i.sourceType==="wechat");
    if(state.src==="selected") items = items.filter(i=>(i.score||0) >= 75);
    if(state.cat) items = items.filter(i=>i.classification && i.classification.cat===state.cat);
    if(q) items = items.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.summary||"").toLowerCase().includes(q));
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n); }).join("");
    html += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${esc(sec.label)}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  body.innerHTML = html + (total===0 ? `<p style="color:var(--mut)">无匹配内容。</p>` : "");
}

function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* 日期导航（左栏） */
document.getElementById("dateList").innerHTML = (DATA.nav||[]).map(h=>
  `<a class="dlink ${h.date===DATA.range.start || h.url.endsWith(DATA.vol.slice(4).replace(/\./g,'-')+'.html')?'':''}${h.date===(DATA.vol.slice(4).replace(/\./g,'-'))?'cur':''}" href="${esc('../'+h.url)}">
    <span class="d-top">${esc(h.label)}<span class="badge ${h.finalized?'lock':'live'}">${h.finalized?'定稿':'更新中'}</span></span>
    <span class="d-title">${esc(h.title||'')}</span></a>`).join("");

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); state.tab = t.dataset.tab; render();
});
if(DATA.weekData && !DATA.weekData.available){
  document.getElementById("weekTab").title = DATA.weekData.note || "";
}
document.querySelectorAll(".fchip[data-src]").forEach(chip=>chip.onclick=function(){
  const turningOn = !this.classList.contains("on");
  document.querySelectorAll(".fchip[data-src]").forEach(x=>x.classList.remove("on"));
  if(turningOn) this.classList.add("on");
  state.src = turningOn ? this.dataset.src : null;
  render();
});
/* P4：AI 分类筛选（组内互斥，与来源组/关键词正交叠加） */
document.querySelectorAll(".fchip[data-cat]").forEach(chip=>chip.onclick=function(){
  const turningOn = !this.classList.contains("on");
  document.querySelectorAll(".fchip[data-cat]").forEach(x=>x.classList.remove("on"));
  if(turningOn) this.classList.add("on");
  state.cat = turningOn ? this.dataset.cat : null;
  render();
});
document.getElementById("q").oninput=function(){ state.q=this.value; render(); };
document.addEventListener("click", e=>{
  const pr = e.target.closest(".peek-row");
  if(pr){ jumpToSection(pr.dataset.label); return; }
});

render();
</script>
</body>
