<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 周期刊</title>
<style>
  :root{--bg:#0b0e14;--bg2:#11151f;--card:#161b27;--card2:#1b2230;--txt:#e6e9ef;--mut:#9aa4b2;--line:#222a38;--accent:#6366f1;--wx:#07c160;--fav:#fcd34d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2138 0%,var(--bg) 55%) fixed;color:var(--txt);line-height:1.6;padding-bottom:64px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{padding:44px 0 24px;text-align:center;border-bottom:1px solid var(--line)}
  .vol{color:var(--mut);font-size:13px;letter-spacing:.22em;text-transform:uppercase}
  .hero h1{font-size:clamp(26px,5vw,40px);font-weight:800;margin:10px 0 6px;background:linear-gradient(90deg,#a5b4fc,#67e8f9,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cn{font-size:15px;color:var(--txt);font-weight:600;letter-spacing:.06em}
  .meta{color:var(--mut);font-size:13px;margin-top:6px}
  .lead{margin:18px auto 0;max-width:760px;font-size:14px;color:#cbd5e1;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;text-align:left}
  .lead .tag{color:var(--accent);font-weight:700;margin-right:6px}
  /* 今日看点（版块索引） */
  .peek{margin:26px 0 30px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .peek-h{padding:12px 16px;font-size:15px;font-weight:800;border-bottom:1px solid var(--line);background:var(--card2)}
  .peek-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px dashed var(--line);cursor:pointer;transition:.15s;text-align:left}
  .peek-row:last-child{border-bottom:none}
  .peek-row:hover{background:var(--card2)}
  .peek-num{font-size:13px;font-weight:800;color:var(--c);min-width:26px}
  .peek-label{font-size:14px;font-weight:700;white-space:nowrap}
  .peek-c{font-size:12px;color:var(--mut);white-space:nowrap}
  .peek-title{font-size:12.5px;color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .block{margin-bottom:36px;scroll-margin-top:64px}
  .bh{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .bh .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .bh h2{font-size:19px;font-weight:700}.bh .c{margin-left:auto;font-size:13px;color:var(--mut)}
  .block.flash{animation:secflash 1.6s ease}
  @keyframes secflash{0%,100%{box-shadow:none}15%,45%{box-shadow:0 0 0 3px var(--c),0 0 40px -8px var(--c);border-radius:14px}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:17px 17px 15px;display:flex;flex-direction:column;min-height:165px;transition:.18s;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);opacity:.85}
  .card.wx::before{background:var(--wx)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px -12px var(--c)}
  .card.wx:hover{border-color:var(--wx);box-shadow:0 10px 30px -12px var(--wx)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .num{font-size:12.5px;font-weight:800;color:#0b0e14;background:#a5b4fc;border-radius:8px;padding:2px 8px;min-width:32px;text-align:center}
  .card.wx .num{background:#6ee7b7}
  .source{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .source.wx{color:#7ee2a8;border-color:#0c3a22}
  /* P4：AI 两级分类徽章与维度胶囊 */
  .cat-badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;color:var(--cc);border:1px solid var(--cc);background:var(--card2)}
  .dim-pill{font-size:10.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .catrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .score-badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .score-badge.hi{color:#fcd34d;background:rgba(252,211,77,.13);border:1px solid rgba(252,211,77,.4)}
  .score-badge.mid{color:#a5b4fc;background:rgba(165,180,252,.12);border:1px solid rgba(165,180,252,.35)}
  .score-badge.lo{color:var(--mut);background:var(--card2);border:1px solid var(--line)}
  .time{margin-left:auto;font-size:11px;color:var(--mut)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}
  .title a{color:var(--txt);text-decoration:none}.title a:hover{color:#a5b4fc;text-decoration:underline;text-decoration-color:var(--accent)}
  .card.wx .title a:hover{color:#6ee7b7}
  .summary{font-size:13px;color:var(--mut);flex:1;margin-bottom:13px}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
  .read{font-size:12.5px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:5px 11px;transition:.18s}
  .read:hover{background:var(--accent);color:#0b0e14}
  .card.wx .read{color:#6ee7b7;border-color:var(--wx)}.card.wx .read:hover{background:var(--wx);color:#04130b}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}
  .back{font-size:13px;font-weight:600;color:#a5b4fc;text-decoration:none;border:1px solid var(--accent);border-radius:9px;padding:6px 13px;transition:.18s}
  .back:hover{background:var(--accent);color:#0b0e14}
  .jchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .jchip{font-size:12px;color:var(--mut);border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 11px;text-decoration:none;transition:.18s}
  .jchip:hover{color:var(--txt);border-color:var(--fav)}
  .jchip.cur{color:#0b0e14;background:linear-gradient(90deg,#fcd34d,#f59e0b);border-color:transparent;font-weight:700}
  .foot{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;color:var(--mut);font-size:12.5px;text-align:center}
  .foot a{color:#67e8f9;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="vol" id="vol"></div>
    <h1>本周看点</h1>
    <div class="cn" id="cn"></div>
    <div class="meta" id="meta"></div>
    <div class="lead" id="lead" style="display:none"></div>
  </header>
  <div class="bar">
    <a class="back" href="../index.html">← 返回最新日报</a>
    <div class="catrow">
      <span class="fchip catc" data-cat="financing">融资</span>
      <span class="fchip catc" data-cat="release">发布</span>
      <span class="fchip catc" data-cat="bigtech">大厂</span>
      <span class="fchip catc" data-cat="paper">论文</span>
      <span class="fchip catc" data-cat="interview">访谈</span>
      <span class="fchip catc" data-cat="general">泛行业</span>
    </div>
    <div class="jchips" id="jchips"></div>
  </div>
  <div class="peek" id="peek" style="display:none"></div>
  <div id="sections"></div>
  <footer class="foot">
    <p>本期共 <b id="ftotal" style="color:var(--txt)"></b> 条 · 数据来源：<a href="https://aihot.virxact.com" target="_blank" rel="noopener noreferrer">AI HOT</a> + 微信公众号 · 周期刊（已定稿）</p>
    <p style="margin-top:5px;opacity:.7">时间均为北京时间 · 摘要由 AI 生成，点击「阅读原文」核对详情</p>
  </footer>
</div>

const DATA = {"view":"daily","range":{"start":"2026-08-10","end":"2026-08-16","label":"2026年8月10日 星期一 至 2026年8月16日 星期日"},"total":4,"lead":"新兴多智能体系统的模式与问题","sections":[{"label":"模型发布/更新","count":1,"items":[{"id":"aihot:cmst9yj3c05utrodz443l0odv","title":"Gemini 3.7 Flash 全面上线 Pro 与 Ultra 用户","summary":"Gemini 3.7 Flash 现已向 Gemini 聊天中的 Pro 和 Ultra 用户开放。该模型更新提升了多步骤任务的推理与准确性，如智能整合数十个文件和邮件为一份主文档。同时，Gemini Spark 也已运行于 3.7 Flash，通过改进对 Google Workspace 应用的工具调用，让个人 AI 智能体更精准。","url":"https://x.com/GeminiApp/status/2088326407730692538","source":"X：Gemini (@GeminiApp)","sourceType":"aihot","category":"模型发布/更新","categoryUnclassified":false,"publishedAt":"2026-08-14T18:06:29.000Z","publishedPrecision":"datetime","timeEvidence":null,"discoveredAt":"2026-08-14T18:22:41.004Z","timeBasis":"published","score":66,"selected":true,"aihotUrl":"https://aihot.virxact.com/items/cmst9yj3c05utrodz443l0odv","originalUrl":"https://x.com/GeminiApp/status/2088326407730692538","reason":null,"mpName":null,"sourceRefs":[],"evidenceKind":null,"classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"AI模型"},{"label":"发布主体","value":"大厂/非创业公司"}],"autoFallback":false},"num":4,"timeText":"8/15 02:06"}]},{"label":"产品发布/更新","count":0,"items":[]},{"label":"AI泛娱乐新闻","count":0,"items":[]},{"label":"行业动态","count":1,"items":[{"id":"aihot:cmsuto7hk0912rouhodiiywlk","title":"Cursor 正式被 SpaceX 收购","summary":"Cursor 已被 SpaceX 正式收购，完成自 4 月启动的收购流程。借助 SpaceX 全球最大规模的 GPU 集群，Cursor 将构建更强且运行成本更低的模型，并以更低价格向客户提供更强大的模型。本周三发布的 Grok 4.6 是双方合作成果的早期体现。","url":"https://cursor.com/blog/joining-spacex","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"行业动态","categoryUnclassified":false,"publishedAt":"2026-08-15T20:05:54.703Z","publishedPrecision":"datetime","timeEvidence":null,"discoveredAt":"2026-08-15T20:22:17.762Z","timeBasis":"published","score":71,"selected":true,"aihotUrl":"https://aihot.virxact.com/items/cmsuto7hk0912rouhodiiywlk","originalUrl":"https://cursor.com/blog/joining-spacex","reason":null,"mpName":null,"sourceRefs":[],"evidenceKind":null,"classification":{"cat":"financing","catLabel":"融资动态","dims":[{"label":"行业","value":"其他AI应用"},{"label":"国家/地区","value":"美国"}],"autoFallback":false},"num":2,"timeText":"8/16 04:05"}]},{"label":"论文研究","count":2,"items":[{"id":"aihot:cmsvptx2m061frovmjoavsi0l","title":"新兴多智能体系统的模式与问题","summary":"随着AI智能体在共享代码库、市场等社会系统中承担更多任务，智能体间的真实交互将激增，其交互量可能超过人机交互。Anthropic实验显示，协调式智能体群在2700万token运行中发现266个漏洞，远超独立并行方法的21个，但两者互补性明显。智能体虽擅长工具使用，但在长期协作与协调方面仍面临挑战。","url":"https://www.anthropic.com/research/multiagent-systems","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","categoryUnclassified":false,"publishedAt":"2026-08-16T11:17:57.393Z","publishedPrecision":"datetime","timeEvidence":null,"discoveredAt":"2026-08-16T11:22:31.379Z","timeBasis":"published","score":73,"selected":true,"aihotUrl":"https://aihot.virxact.com/items/cmsvptx2m061frovmjoavsi0l","originalUrl":"https://www.anthropic.com/research/multiagent-systems","reason":null,"mpName":null,"sourceRefs":[],"evidenceKind":null,"classification":{"cat":"paper","catLabel":"论文研究","dims":[],"autoFallback":false},"num":1,"timeText":"8/16 19:17"},{"id":"aihot:cmsuaf2hr05zgroe0y1e7275v","title":"AI生成书籍正淹没亚马逊，并拉低人类作者的单书收入","summary":"一项对14，419本自出版电子书的分析显示，AI生成书籍正以数量而非质量挤占人类作者市场，即便未检测到AI文本的书籍，单书收入也在下滑。2023年Q1至2026年Q1，书目总量增长38.3倍，而季度收入仅增长8.9倍；在八个类型中，七个类型的无AI文本书籍单书收入下降。","url":"https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors","source":"The Decoder：AI News（RSS）","sourceType":"aihot","category":"论文研究","categoryUnclassified":false,"publishedAt":"2026-08-15T11:00:50.000Z","publishedPrecision":"datetime","timeEvidence":null,"discoveredAt":"2026-08-15T11:23:17.740Z","timeBasis":"published","score":70,"selected":true,"aihotUrl":"https://aihot.virxact.com/items/cmsuaf2hr05zgroe0y1e7275v","originalUrl":"https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors","reason":null,"mpName":null,"sourceRefs":[],"evidenceKind":null,"classification":{"cat":"general","catLabel":"泛行业新闻","dims":[],"autoFallback":false},"num":3,"timeText":"8/15 19:00"}]},{"label":"技巧与观点","count":0,"items":[]}],"stats":[{"label":"模型发布/更新","count":1},{"label":"产品发布/更新","count":0},{"label":"AI泛娱乐新闻","count":0},{"label":"行业动态","count":1},{"label":"论文研究","count":2},{"label":"技巧与观点","count":0}],"mpStatus":{},"generatedAt":"2026-09-14T08:21:49Z","vol":"VOL.2026 · 八月第2周","dateLabel":"2026年8月10日 星期一 至 2026年8月16日 星期日","cnLabel":"二〇二六年八月十日 至 二〇二六年八月十六日","nav":[{"url":"weekly/2026-09-07.html","label":"九月第1周","range":"9月7日 - 9月13日","total":842},{"url":"weekly/2026-08-24.html","label":"八月第4周","range":"8月24日 - 8月30日","total":49},{"url":"weekly/2026-08-17.html","label":"八月第3周","range":"8月17日 - 8月23日","total":65}]};
const SECTION_COLORS = {"模型发布/更新":"#6366f1","产品发布/更新":"#10b981","AI泛娱乐新闻":"#ec4899","行业动态":"#f59e0b","论文研究":"#f43f5e","技巧与观点":"#06b6d4"};
const CATEGORY_COLORS = {"financing":"#f59e0b","release":"#6366f1","bigtech":"#0ea5e9","paper":"#f43f5e","interview":"#a855f7","general":"#64748b"};
let state = { cat:null };

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cardHTML(i, n){
  const wx = i.sourceType==="wechat";
  return '<article class="card ' + (wx?'wx':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    '<div class="ct"><span class="num">' + String(n).padStart(2,'0') + '</span>' +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      (i.classification ? '<span class="cat-badge" style="--cc:' + (CATEGORY_COLORS[i.classification.cat]||'#64748b') + '">' + esc(i.classification.catLabel) + '</span>' +
        (i.classification.dims||[]).slice(0,2).map(d=>'<span class="dim-pill">' + esc(d.value) + '</span>').join('') : '') +
      (typeof i.score === 'number' ? '<span class="score-badge ' + (i.score>=80?'hi':(i.score>=70?'mid':'lo')) + '">AI ' + i.score + '</span>' : '') +
      '<span class="time">' + esc(i.timeText||'') + '</span></div>' +
    '<h3 class="title"><a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a></h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    '<div class="card-foot"><a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a></div>' +
    '</article>';
}

/* 今日看点：版块索引（编号 + 条数 + 头条），点击跳转版块 */
function renderPeek(){
  const rows = DATA.sections.filter(s=>s.count>0);
  if(!rows.length){ document.getElementById("peek").style.display="none"; return; }
  document.getElementById("peek").style.display="";
  document.getElementById("peek").innerHTML = '<div class="peek-h">本周看点</div>' + rows.map((s,ix)=>{
    const lead = s.items.reduce((a,b)=>((b.score||0)>(a.score||0)?b:a), s.items[0]);
    return `<div class="peek-row" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}">
      <span class="peek-num">${String(ix+1).padStart(2,'0')}</span>
      <span class="peek-label">${esc(s.label)}</span>
      <span class="peek-c">${s.count} 条</span>
      <span class="peek-title">${esc((lead&&lead.title)||'')}</span></div>`;
  }).join("");
}

function render(){
  document.getElementById("vol").textContent = `${DATA.vol} · ${DATA.total} STORIES · AI HOT WEEKLY`;
  document.getElementById("cn").textContent = DATA.cnLabel || "";
  document.getElementById("meta").innerHTML = `${esc(DATA.dateLabel)} · 共 <b>${DATA.total}</b> 条 · 六版块 · 已定稿`;
  const lead = document.getElementById("lead");
  if(DATA.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">本周头条</span>${esc(DATA.lead)}`; }
  else lead.style.display="none";
  renderPeek();
  let sectionsHtml = ""; let total=0;
  DATA.sections.forEach(sec=>{
    let items = sec.items;
    if(state.cat) items = items.filter(i=>i.classification && i.classification.cat===state.cat);
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${esc(sec.label)}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}

function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

document.addEventListener("click", e=>{
  const pr = e.target.closest(".peek-row");
  if(pr){ jumpToSection(pr.dataset.label); return; }
});

/* 其他周期刊导航 */
document.getElementById("jchips").innerHTML = (DATA.nav||[]).map(w=>
  `<a class="jchip ${location.pathname.includes(w.url)?'cur':''}" href="${esc(w.url)}">${esc(w.label)} · ${w.total}条</a>`).join("");

/* P4：AI 分类筛选（组内互斥） */
document.querySelectorAll(".fchip[data-cat]").forEach(chip=>chip.onclick=function(){
  const turningOn = !this.classList.contains("on");
  document.querySelectorAll(".fchip[data-cat]").forEach(x=>x.classList.remove("on"));
  if(turningOn) this.classList.add("on");
  state.cat = turningOn ? this.dataset.cat : null;
  render();
});

render();
</script>
</body>
</html>
