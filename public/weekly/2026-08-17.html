egory":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"financing","catLabel":"融资动态","dims":[{"label":"行业","value":"其他AI应用"},{"label":"国家/地区","value":"中国"}],"autoFallback":false},"num":25,"timeText":"8/20 12:00"},{"id":"manus:9edcefe915f47d7b","title":"世界模型驶入F1赛道：探索极限工况下具身智能体的认知物理边界","summary":"当自动驾驶赛车以近 300 km/h 的时速在 F1 赛道上与周车进攻防守、交互博弈，它面对的问题早已不只是提升圈速。","url":"https://news.qq.com/rain/a/20260820A08RMB00","source":"公众号：机器之心","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"general","catLabel":"泛行业新闻","dims":[],"autoFallback":true},"num":29,"timeText":"8/20 12:00"},{"id":"manus:647560b405f0cf29","title":"刚刚，DeepSeek Harness更新！增强多模态","summary":"DeepSeek Harness 迎来一波大更新，RC.8 版本已经放出。","url":"https://news.qq.com/rain/a/20260820A05GGM00","source":"公众号：机器之心","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"general","catLabel":"泛行业新闻","dims":[],"autoFallback":true},"num":30,"timeText":"8/20 12:00"},{"id":"manus:bffc511f4894a647","title":"一颗「星脑」所有身体用，银河通用双足机器人首秀","summary":"在2025年世界机器人大会上，银河通用发布首款双足人形机器人Galbot ET1，其基于自研具身大模型AstraBrain，支持实时学习人类动作并完成舞蹈等高难度运动。银河通用同时展示了G1、S1等机器人在家庭、零售、工业场景的应用，其中S1已在宁德时代产线实现7×24小时常态化运行。论坛期间，公司还发布了《全球具身智能大模型研究报告》，提出具身大模型评价体系框架。","url":"https://news.qq.com/rain/a/20260820A058XW00","source":"公众号：机器之心","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"其他AI应用"},{"label":"发布主体","value":"创业公司"}],"autoFallback":false},"num":31,"timeText":"8/20 12:00"},{"id":"manus:36141550986b5916","title":"北大与微软亚研提出 BCP，让模型自己决定何时重规划","summary":"在 action chunking 已成为 VLA 标配的今天，「一次执行多少步」几乎被所有工作当作一个固定的超参数。北京大学与微软亚洲研究院的一项新工作指出：这个默认设定本身就是一个重要的失败原因 —— 它让重规划变成了与任务进度无关的周期性调度，当没有任何一次重规划恰好落在关键操作阶段之前时，机器人只能带着一个已经过时的 chunk 进入关键操作环节。","url":"https://news.qq.com/rain/a/20260820A054CT00","source":"公众号：机器之心","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"general","catLabel":"泛行业新闻","dims":[],"autoFallback":true},"num":32,"timeText":"8/20 12:00"},{"id":"manus:8f33ed2af36581c4","title":"中国首次实现火箭陆地回收；宇树上市，市值最高超 4000 亿；蔡明同款机器人亮相，9.9 万元｜极客早知道","summary":"8月19日，朱雀三号遥二运载火箭成功发射，实现我国首次火箭陆地回收；宇树科技在科创板上市，首日股价一度涨超600%，市值超4400亿元；OpenAI首席财务官表示公司或于2027年上市；Anthropic年化营收达650亿美元；Moderna与默沙东合作的黑色素瘤疫苗试验成功；OpenAI推出ChatGPT青少年模式；智谱上线GLM-5.3模型；问界儿童车开启预订，售价15800元；松延动力展出仿生机器人，基础款9.9万元。","url":"https://news.qq.com/rain/a/20260820A03XYN00","source":"公众号：极客公园","sourceType":"wechat","category":"模型发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"极客公园","classification":{"cat":"financing","catLabel":"融资动态","dims":[{"label":"行业","value":"其他AI应用"},{"label":"国家/地区","value":"中国"}],"autoFallback":false},"num":36,"timeText":"8/20 12:00"},{"id":"aihot:cmt05zhyg139trodp6bxsy9e2","title":"Liquid AI 发布 LFM2.5 系列 QAD Q4_0 量化检查点，恢复 97% 精度损失","summary":"Liquid AI 发布基于量化感知蒸馏（QAD）训练的 LFM2.5-230M、350M、1.2B-Instruct 和 2.6B 四款 Q4_0 GGUF 检查点，在保持原生 Q4_0 内存与速度的同时，恢复 BF16 平均精度损失的 97%。","url":"https://huggingface.co/blog/LiquidAI/qad","source":"Hugging Face：Blog（RSS）","sourceType":"aihot","category":"模型发布/更新","publishedAt":"2026-08-19T13:48:49.000Z","score":64,"selected":true,"mpName":null,"classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"AI模型"},{"label":"发布主体","value":"创业公司"}],"autoFallback":false},"num":39,"timeText":"8/19 21:48"}]},{"label":"产品发布/更新","count":17,"items":[{"id":"aihot:cmt3wt4qm13utro6t0hb6ga3y","title":"蚂蚁百灵为SGLang推出权重缓存守护进程","summary":"今天，我们为 SGLang 推出 Weight Cache Daemon。🚀 在 Ling-2.6-1T FP8 上，它将权重加载时间缩短至约 0.63 秒，比磁盘加载快约 780 倍，并将引擎总启动时间从 8.8 分钟缩短至约 0.53 分钟。其工作原 ":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"其他AI应用"},{"label":"发布主体","value":"创业公司"}],"autoFallback":false},"num":16,"timeText":"8/21 00:02"},{"id":"aihot:cmt1r7jjh05lgroovc4zwypj6","title":"AlloyDB ScaNN 如何将向量搜索扩展到 100 亿向量","summary":"AlloyDB 的 ScaNN 索引现已支持超过 100 亿向量的规模，通过全新的四层树架构（预览版）实现，将查询复杂度从 O（N^1/2） 降至 O（N^1/4）。内部测试中，该架构在 100 亿向量规模下可实现 p95 延迟不超过 51 毫秒、召回率达 95%。该功能可通过快速入门指南部署，新用户可享受 30 天免费试用。","url":"https://cloud.google.com/blog/products/databases/alloydb-scann-index-four-level-tree-improves-vector-search","source":"Google Cloud：Databases（RSS）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-20T16:00:00.000Z","score":65,"selected":true,"mpName":null,"classification":null,"num":17,"timeText":"8/21 00:00"},{"id":"aihot:cmt396dpw0kj0ro6tdktqkp8s","title":"Claude Mythos 5 网络安全能力扩展至更多防御者","summary":"Anthropic 宣布 Claude Mythos 5 现已集成至 Claude Security，并即将登陆合作伙伴的网络安全防御工具。公司同时推出 3500 万美元的 Defender Advantage Fund（0xDAF），用于资助开源软件漏洞修复与安全自动化。","url":"https://claude.com/blog/bringing-claude-mythos-5-to-more-defenders","source":"Claude：Blog（网页）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-20T16:00:00.000Z","score":61,"selected":true,"mpName":null,"classification":null,"num":18,"timeText":"8/21 00:00"},{"id":"manus:95840fd56022a1bc","title":"WorkSwarm让Agent组队干活，JiuwenBox安全沙箱守护每一步执行","summary":"openJiuwen将旗下蜂群智能体升级为WorkSwarm蜂群办公智能体，并推出JiuwenBox安全沙箱。JiuwenBox提供Linux任务级沙箱、Windows沙箱和开发中的微虚机沙箱三种隔离等级，支持跨平台，通过统一API管理。它可与WorkSwarm集成，用户可通过/sandbox命令或config.yaml配置，也可用CLI独立使用。沙箱采用进程隔离、文件权限控制、网络限制、资源配额等机制，并支持策略自定义和全程审计。","url":"https://news.qq.com/rain/a/20260820A0B92Y00","source":"公众号：机器之心","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"其他AI应用"},{"label":"发布主体","value":"大厂/非创业公司"}],"autoFallback":false},"num":26,"timeText":"8/20 12:00"},{"id":"aihot:cmt0kxcuu07f2ro2owuqpbjc8","title":"FastMetal 让 Mac 本地 30 秒生成视频","summary":"一段 5 秒 480P 视频，完全在 Mac 上生成，耗时 30 秒。无需 CUDA，无需云端，仅占用 3.9 GiB 内存。\n\nFastMetal 将 FastWan-QAD 系列带到 Apple Silicon。DiT、DMD 采样器和解码器均通过 MLX 在 Metal 上运行，默认 INT8。\n\n三个模型：1.3B 支持 480P，5B 支持 720P，14B 追求画质。\n\n📷 博客：http://haoailab.com/blogs/fastmetal 📷 代码：http://github.com/hao-ai-lab/FastVideo 📷 模型：http://huggingface.co/collections/FastVideo/fastmetal","url":"https://x.com/haoailab/status/2090177721913770407","source":"X：Sky Computing Lab (@haoailab)","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-19T20:42:57.000Z","score":71,"selected":true,"mpName":null,"classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"AI模型"},{"label":"发布主体","value":"创业公司"}],"autoFallback":false},"num":38,"timeText":"8/20 04:42"},{"id":"aihot:cmszeb2mx0b3srodpef1ub0j0","title":"GLM-5.3上线：AA智能指数60分并列开源第一，成本更低","summary":"GLM-5.3 API即日上线，擅长复杂编码、防御性网络安全与长程任务，在AA综合智能指数中取得60分，与Claude Fable 5、GPT-5.6 Sol等闭源旗舰同级，并与Kimi K3并列开源模型第一。该模型以更小参数规模和更低调用成本降低前沿智能门槛，单任务成本为旗舰模型中最低。API定价与GLM-5.2持平，模型权重将于下周五开源。","url":"https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&mid=2247494105&idx=1&sn=8d7409e0fb846a3c7803c142b5d1a8e7","source":"公众号：智谱（GLM）","sourceType":"wechat","category":"产品发布/更新","publishedAt":"2026-08-19T01:03:29.000Z","score":79,"selected":true,"mpName":null,"classification":{"cat":"release","catLabel":"产品和模型发布","dims":[{"label":"行业","value":"AI模型"},{"label":"发布主体","value":"创业公司"}],"autoFallback":false},"num":40,"timeText":"8/19 09:03"},{"id":"aihot:cmt1xbu7q0b7troovffggr2jh","title":"Grok Build 全面上线网页与移动端，所有套餐可用","summary":"Grok Build 现已面向所有套餐开放，支持网页、iOS 和 Android 端使用。用户描述应用、游戏或网站后，Grok 可在聊天中实时生成可运行版本。该功能自 7 月推出 Early Beta 以来，新增了发布分享、接入 X 及调用 Grok 自身模型等能力，发布的应用可获得 grok.me 链接并支持自定义域名、导出到 GitHub 等。","url":"https://x.ai/news/grok-build-for-everyone","source":"xAI：News（网页）","sourceType":"aihot","category":"产品发布/更新","publishedAt":"2026-08-19T00:00:00.000Z","score":82,"selected":true,"mpName":null /105.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-22T14:13:48.000Z","score":71,"selected":true,"mpName":null,"classification":null,"num":4,"timeText":"8/22 22:13"},{"id":"manus:cec600530af7a6db","title":"Physical Token经济学：下一项能力更便宜，机器人才能真正规模化","summary":"8月19日，WRC 2026期间，跨维智能主办的物理AI引领者论坛在北京举行，贾奎、梅涛、王晓刚、苏航等人出席。贾奎发表《Physical Token经济学》演讲，提出以获取新能力的边际成本衡量可靠物理智能的生产成本，并介绍跨维在数据、仿真、后训练和部署反馈方面的路径。跨维还在现场展示了手机装机质检、商超自主扫码、冰淇淋与爆米花连续操作等Demo。6月底，跨维智能宣布完成10亿元B轮融资，投后估值超过百亿元。","url":"https://news.qq.com/rain/a/20260820A08RYD00","source":"公众号：机器之心","sourceType":"wechat","category":"行业动态","publishedAt":"2026-08-20T12:00:00+08:00","score":null,"selected":null,"mpName":"机器之心","classification":{"cat":"financing","catLabel":"融资动态","dims":[{"label":"行业","value":"其他AI应用"},{"label":"国家/地区","value":"中国"}],"autoFallback":false},"num":28,"timeText":"8/20 12:00"},{"id":"aihot:cmt0s2ems0dkxro2oylebzxob","title":"消息称 OpenAI 首席财务官告知员工：公司最迟将于 2027 年上市","summary":"OpenAI 首席财务官萨拉·弗里亚尔在全员大会上告知员工，公司最迟将于 2027 年完成上市，若业务持续向好也可能更早。OpenAI 已于 6 月秘密提交 IPO 招股书，本季度整体年化营收增长 35%，企业级业务年化营收增长 50%，AI 编程与办公产品周活跃用户突破 2000 万。","url":"https://www.ithome.com/0/991/886.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-20T00:17:26.000Z","score":71,"selected":true,"mpName":null,"classification":{"cat":"bigtech","catLabel":"大厂动态","dims":[{"label":"类型","value":"其他"},{"label":"公司","value":"OpenAI"}],"autoFallback":false},"num":37,"timeText":"8/20 08:17"},{"id":"aihot:cmt0d2tsl1961rodpnvzxo4cc","title":"OpenRouter 宣布加入 Stripe","summary":"OpenRouter 宣布与 Stripe 合并，以加速推动全球经济增长。OpenRouter 目前每日处理来自 400 多个 AI 模型的 10+ 万亿 token，服务超 1000 万开发者与公司，自成立以来推理量每年至少增长 10 倍。合并后 OpenRouter 将继续以原名、原使命独立运营，产品与路线图不变，路由决策仍以用户利益为先，交易预计在未来数周内完成。","url":"https://openrouter.ai/blog/announcements/openrouter-is-joining-stripe","source":"OpenRouter：Announcements（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-19T00:00:00.000Z","score":72,"selected":true,"mpName" ,"value":"其他"}],"autoFallback":false},"num":60,"timeText":"8/17 20:34"},{"id":"aihot:cmsx9jy2a05yerommy1e0jc6t","title":"A 股迎来\"人形机器人第一股\"，宇树科技官宣 8 月 19 日科创板上市","summary":"宇树科技宣布股票将于 2026 年 8 月 19 日在科创板上市，发行价 150.80 元/股，对应市值约 609.93 亿元，预计募资约 60.99 亿元。该公司 2023 至 2025 年营收分别为 1.59 亿元、3.93 亿元和 16.99 亿元，净利润分别为-1114.51 万元、9547.47 万元和 2.78 亿元，是全球少数实现盈利的高性能通用机器人公司。","url":"https://www.ithome.com/0/990/812.htm","source":"IT之家（RSS）","sourceType":"aihot","category":"行业动态","publishedAt":"2026-08-17T12:25:27.000Z","score":73,"selected":true,"mpName":null,"classification":{"cat":"financing","catLabel":"融资动态","dims":[{"label":"行业","value":"其他AI应用"},{"label":"国家/地区","value":"中国"}],"autoFallback":false},"num":61,"timeText":"8/17 20:25"}]},{"label":"论文研究","count":7,"items":[{"id":"aihot:cmt2ry1sl04ywro6t5znttdrs","title":"每个模型都会作弊：针对攻击性网络任务作弊的提示词缓解研究","summary":"一项针对22个前沿模型的审计发现，基线条件下37.1%的通过任务涉及作弊，平均通过率41.5%而真实解决率仅26.1%，个别模型虚增高达5倍。即便加入标准反作弊指令，作弊率仅从33.0%降至8.5%，最严苛提示下仍有8个模型作弊、4个出现反效果。","url":"https://dreadnode.io/research/every-model-cheats-prompt-level-mitigation-of-cheating-on-offensive-cyber-tasks","source":"Hacker News 热门（buzzing.cc 中文翻译）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-21T09:25:43.682Z","score":75,"selected":true,"mpName":null,"classification":null,"num":9,"timeText":"8/21 17:25"},{"id":"aihot:cmt30vskr0e0wro6t19q13yic","title":"测量语音识别中的基准优化：Hugging Face 新测试揭示 ASR 模型\"刷分\"现象","summary":"Hugging Face 最新研究引入三项测试量化语音识别中的基准优化（benchmaxxing）现象。对 11 个开源 ASR 模型的评估显示，多个高分系统会复现 VoxPopuli 和 LibriSpeech 基准的错误转录文本，即使音频内容与之矛盾。部分模型甚至依赖声学线索识别基准来源，导致其得分高估了真实转录能力。","url":"https://huggingface.co/blog/asr-benchmark-optimization","source":"Hugging Face：Blog（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-21T00:00:00.000Z","score":69,"selected":true,"mpName":null,"classification":null,"num":12,"timeText":"8/21 08:00"},{"id":"aihot:cmt393qov0kfhro6tuwhxhubl","title":"Ling-3.0-flash 在 4 块 Blackwell GPU 上如何将批处理 1 解码延迟降低 54%","summary":"蚂蚁 Ling Infra 团队与 RadixArk SGLang 团队将 Ling-3.0-flash 混合线性注意力 MoE 模型的单请求解码速度从 288 tok/s 提升至 606 tok/s，平均 TPOT 从 3.33 ms 降至 1.53 ms。","url":"https://www.lmsys.org/blog/2026-08-21-ling3-flash-spec-decode-blackwell","source":"LMSYS：Blog（Chatbot Arena 团队）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-20T16:00:00.000Z","score":63,"selected":true,"mpName":null,"classification":null,"num":19,"timeText":"8/21 00:00"},{"id":"aihot:cmsz1974l06hbro20gosn5d78","title":"智能体记忆并非越多越好：八款模型评测显示剂量需按能力校准","summary":"智能体记忆并非可随意开启的功能，而是需按模型能力校准的剂量。强模型适合注入完整指南集，DeepSeek-V3.2（671B MoE）任务完成率提升+9.5个百分点；较弱模型采用精选检索效果最佳，gpt-oss-120b（117B MoE）提升+16.1pp且仅增加+5% token。该方法无需更新权重或人工标注，通过从智能体过往轨迹中蒸馏指南并在推理时注入实现。","url":"https://huggingface.co/blog/ibm-research/altk-evolve-hmm","source":"Hugging Face：Blog（RSS）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-18T18:09:38.000Z","score":66,"selected":true,"mpName":null,"classification":{"cat":"paper","catLabel":"论文研究","dims":[],"autoFallback":false},"num":45,"timeText":"8/19 02:09"},{"id":"aihot:cmt0e7sxo01eiro2o4l4y9jmh","title":"突破 DeepSeek-V4-Pro 服务极限：H20 上的多场景优化方法","summary":"LMSYS 团队针对 1.6 万亿参数的 MoE 模型 DeepSeek-V4-Pro，在 H20 GPU 上通过场景化服务配置逼近 B300 性能。单节点 H20-141GB 参考实现达 271 output tokens/s，与 B300 的 383.7 tokens/s 性能差距缩小至 1.42×。","url":"https://www.lmsys.org/blog/2026-08-19-deepseek-v4-pro-engine-optimization-h20","source":"LMSYS：Blog（Chatbot Arena 团队）","sourceType":"aihot","category":"论文研究","publishedAt":"2026-08-18T16:00:00.000Z","score":73,"selected":true,"mpName":null,"classification":{"cat":"paper","catLabel":"论文研究","dims":[],"autoFallback":false},"num":46,"timeText":"8/19 00:00"},{"id":"aihot:cmszieman0euzrodptihyllom","title":"StartupBench：面向市场验证端到端工作流的通用智能体基准测试","summary":"StartupBench 是一个基于市场验证的 AI 初创公司产品构建的端到端智能体基准，从真实采用的产品工作流中提炼任务，而非研究者预设任务。在统一智能体框架下，最强模型也仅能完成约 30% 的任务，复杂指令遵循和领域专业知识是主要失败来源。该基准揭示了当前通用智能体在真实用户任务上的能力边界。","url":"https://arxiv.org/abs/2608.17800","source":"HuggingFace Daily Papers（社区热门论文）","sourceType":"aihot","categor const SECTION_COLORS = {"模型发布/更新":"#6366f1","产品发布/更新":"#10b981","AI泛娱乐新闻":"#ec4899","行业动态":"#f59e0b","论文研究":"#f43f5e","技巧与观点":"#06b6d4"};
const CATEGORY_COLORS = {"financing":"#f59e0b","release":"#6366f1","bigtech":"#0ea5e9","paper":"#f43f5e","interview":"#a855f7","general":"#64748b"};
let state = { cat:null };

function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cardHTML(i, n){
  const wx = i.sourceType==="wechat";
  return '<article class="card ' + (wx?'wx':'') + '" style="--c:' + (SECTION_COLORS[i.category]||'#64748b') + '">' +
    '<div class="ct"><span class="num">' + String(n).padStart(2,'0') + '</span>' +
      '<span class="' + (wx?'source wx':'source') + '">' + esc(i.source) + '</span>' +
      (i.classification ? '<span class="cat-badge" style="--cc:' + (CATEGORY_COLORS[i.classification.cat]||'#64748b') + '">' + esc(i.classification.catLabel) + '</span>' +
        (i.classification.dims||[]).slice(0,2).map(d=>'<span class="dim-pill">' + esc(d.value) + '</span>').join('') : '') +
      (typeof i.score === 'number' ? '<span class="score-badge ' + (i.score>=80?'hi':(i.score>=70?'mid':'lo')) + '">AI ' + i.score + '</span>' : '') +
      '<span class="time">' + esc(i.timeText||'') + '</span></div>' +
    '<h3 class="title"><a href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">' + esc(i.title) + '</a></h3>' +
    '<p class="summary">' + esc(i.summary) + '</p>' +
    '<div class="card-foot"><a class="read" href="' + esc(i.url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a></div>' +
    '</article>';
}

/* 今日看点：版块索引（编号 + 条数 + 头条），点击跳转版块 */
function renderPeek(){
  const rows = DATA.sections.filter(s=>s.count>0);
  if(!rows.length){ document.getElementById("peek").style.display="none"; return; }
  document.getElementById("peek").style.display="";
  document.getElementById("peek").innerHTML = '<div class="peek-h">本周看点</div>' + rows.map((s,ix)=>{
    const lead = s.items.reduce((a,b)=>((b.score||0)>(a.score||0)?b:a), s.items[0]);
    return `<div class="peek-row" data-label="${esc(s.label)}" style="--c:${SECTION_COLORS[s.label]||'#64748b'}">
      <span class="peek-num">${String(ix+1).padStart(2,'0')}</span>
      <span class="peek-label">${esc(s.label)}</span>
      <span class="peek-c">${s.count} 条</span>
      <span class="peek-title">${esc((lead&&lead.title)||'')}</span></div>`;
  }).join("");
}

function render(){
  document.getElementById("vol").textContent = `${DATA.vol} · ${DATA.total} STORIES · AI HOT WEEKLY`;
  document.getElementById("cn").textContent = DATA.cnLabel || "";
  document.getElementById("meta").innerHTML = `${esc(DATA.dateLabel)} · 共 <b>${DATA.total}</b> 条 · 六版块 · 已定稿`;
  const lead = document.getElementById("lead");
  if(DATA.lead){ lead.style.display="block"; lead.innerHTML = `<span class="tag">本周头条</span>${esc(DATA.lead)}`; }
  else lead.style.display="none";
  renderPeek();
  let sectionsHtml = ""; let total=0;
  DATA.sections.forEach(sec=>{
    let items = sec.items;
    if(state.cat) items = items.filter(i=>i.classification && i.classification.cat===state.cat);
    if(!items.length) return;
    let n=0; const cards = items.map(i=>{ n++; total++; return cardHTML(i, n); }).join("");
    sectionsHtml += `<section class="block" data-label="${esc(sec.label)}" style="--c:${SECTION_COLORS[sec.label]||'#64748b'}">
      <header class="bh"><span class="dot"></span><h2>${esc(sec.label)}</h2><span class="c">${items.length} 条</span></header>
      <div class="grid">${cards}</div></section>`;
  });
  document.getElementById("sections").innerHTML = sectionsHtml || `<p style="color:var(--mut)">无内容。</p>`;
  document.getElementById("ftotal").textContent = total;
}

function jumpToSection(label){
  const el = document.querySelector('.block[data-label="' + label + '"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

document.addEventListener("click", e=>{
  const pr = e.target.closest(".peek-row");
  if(pr){ jumpToSection(pr.dataset.label); return; }
});

/* 其他周期刊导航 */
document.getElementById("jchips").innerHTML = (DATA.nav||[]).map(w=>
  `<a class="jchip ${location.pathname.includes(w.url)?'cur':''}" href="${esc(w.url)}">${esc(w.label)} · ${w.total}条</a>`).join("");

/* P4：AI 分类筛选（组内互斥） */
document.querySelectorAll(".fchip[data-cat]").forEach(chip=>chip.onclick=function(){
  const turningOn = !this.classList.contains("on");
  document.querySelectorAll(".fchip[data-cat]").forEach(x=>x.classList.remove("on"));
  if(turningOn) this.classList.add("on");
  state.cat = turningOn ? this.dataset.cat : null;
  render();
});

render();
</script>
